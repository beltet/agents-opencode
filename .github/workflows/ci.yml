name: Test and build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/agents-opencode
  artifacts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile six targets
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agents-opencode-cross-platform
          path: dist/*
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agents-opencode-cross-platform
          path: dist
      - name: Publish release (unsigned binaries)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes "Unsigned native binaries. See README for security notes and build/test limits."
