name: Build GUI binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            artifact: linux-x64
          - os: windows-2022
            name: Windows x64
            artifact: windows-x64
          - os: macos-15-intel
            name: macOS Intel
            artifact: macos-x64
          - os: macos-15
            name: macOS Apple Silicon
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          modules: ''
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel 2
          cmake --install build --config Release --prefix staging
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          windeployqt --release --no-translations --dir staging/bin staging/bin/agents-opencode.exe
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item THIRD_PARTY_NOTICES.md staging/bin/
          Copy-Item -Recurse LICENSES staging/bin/
          Compress-Archive -Path staging/bin/* -DestinationPath "release/agents-opencode-${{ matrix.artifact }}.zip" -Force
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          mkdir -p staging/agents-opencode.app/Contents/Resources/Licenses
          cp LICENSES/* staging/agents-opencode.app/Contents/Resources/Licenses/
          cp THIRD_PARTY_NOTICES.md staging/agents-opencode.app/Contents/Resources/
          macdeployqt staging/agents-opencode.app -dmg
          mv staging/agents-opencode.dmg "release/agents-opencode-${{ matrix.artifact }}.dmg"
      - name: Package Linux portable AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release AppDir/usr/bin
          cp staging/bin/agents-opencode AppDir/usr/bin/
          mkdir -p AppDir/usr/share/doc/agents-opencode
          cp THIRD_PARTY_NOTICES.md AppDir/usr/share/doc/agents-opencode/
          cp -r LICENSES AppDir/usr/share/doc/agents-opencode/
          curl -fL --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy.AppImage --appdir AppDir --desktop-file packaging/agents-opencode.desktop --icon-file packaging/agents-opencode.png --plugin qt --output appimage
          appimage=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy.AppImage' -print -quit)
          test -n "$appimage"
          mv "$appimage" release/agents-opencode-linux-x64.AppImage
      - name: Upload downloadable binary
        uses: actions/upload-artifact@v4
        with:
          name: agents-opencode-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agents-opencode-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true
